<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- The Qwiz wordmark (src/components/astro/Wordmark.astro) as a favicon: the same four
         ransom-note cuttings, each with its own family, tilt and chip colour, but stacked 2x2
         instead of in a row. A 4-wide horizontal mark renders each letter about 4px across at a
         16px favicon, which is nothing; a 2x2 grid keeps every letter and every colour at usable
         size, and at the sizes where the letterforms give out it still reads as this app's four
         mismatched chips rather than as a generic square.

         Colours are the light theme's tokens resolved to hex — a favicon can't read the CSS
         variables in global.css, and hex avoids making the icon depend on oklch support in
         whatever is rasterising it (browser tab, bookmark bar, OS shortcut). Keep them in step by
         hand with the ink, accent, negative and warning tokens if those ever change.
         (XML comments cannot contain a double hyphen, so the tokens can't be named verbatim here.)

         Only the Q chip flips for dark mode. The other three sit on saturated fills that hold up
         against a dark tab strip; the Q is near-black on near-white, so left alone it would
         disappear into one. Same reason and same mechanism as the icon this replaced. -->
    <g font-weight="900" text-anchor="middle" dominant-baseline="central">
        <g transform="rotate(-11 17 17)">
            <rect class="q-chip" x="3" y="3" width="28" height="28" rx="2" />
            <text class="q-ink" x="17" y="18" font-family="Georgia, 'Times New Roman', serif"
                  font-size="23">Q</text>
        </g>
        <g transform="rotate(8 47 17)">
            <rect x="33" y="3" width="28" height="28" rx="2" fill="#c25500" />
            <text x="47" y="18" font-family="ui-monospace, Menlo, Consolas, monospace"
                  font-size="21" fill="#fff">w</text>
        </g>
        <g transform="rotate(-6 17 47)">
            <rect x="3" y="33" width="28" height="28" rx="2" fill="#4f39f6" />
            <text x="17" y="48" font-family="ui-sans-serif, system-ui, Helvetica, sans-serif"
                  font-size="24" fill="#fff">i</text>
        </g>
        <g transform="rotate(13 47 47)">
            <rect x="33" y="33" width="28" height="28" rx="2" fill="#e7000b" />
            <text x="47" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="23"
                  font-style="italic" fill="#fff">z</text>
        </g>
    </g>
    <style>
        .q-chip { fill: #0f172b; }
        .q-ink  { fill: #f8fafc; }
        @media (prefers-color-scheme: dark) {
            .q-chip { fill: #f0f2f5; }
            .q-ink  { fill: #13171e; }
        }
    </style>
</svg>
